# XcodeGen: brew install xcodegen && xcodegen generate
name: Newsflow
options:
  bundleIdPrefix: pl.newsflow
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: pl
  createIntermediateGroups: true
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.20.0
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Newsflow:
    type: application
    platform: iOS
    sources:
      - path: Newsflow
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(NEWSFLOW_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(NEWSFLOW_TEAM_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Newsflow/Resources/Info.plist
    dependencies:
      - package: Supabase
        product: Supabase
  NewsflowTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NewsflowTests
    dependencies:
      - target: Newsflow
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Newsflow.app/Newsflow
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Newsflow:
    build:
      targets:
        Newsflow: all
        NewsflowTests: [test]
    test:
      targets:
        - NewsflowTests
